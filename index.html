<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Networking - Serena</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 1. Base y Fondo --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f8f9fa;
            color: #495057;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container { 
            text-align: center; 
            padding: 40px; 
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.05);
            max-width: 600px;
        }

        h1 { 
            margin-bottom: 50px; 
            color: #007bff;
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 300;
            font-size: 2rem;
        }
        
        /* --- 3. Botones y Menú --- */
        .menu-buttons {
            display: flex;
            flex-wrap: wrap; /* Permite que los botones bajen si no caben */
            gap: 25px;
            justify-content: center;
        }

        .btn-menu {
            padding: 25px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #007bff;
            background: #e3f2fd;
            border: 2px solid #b3e5fc;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* Estilo especial para el tercer botón (centrado abajo) */
        .btn-interes {
            width: 250px;
            margin-top: 10px;
            color: #6f42c1; /* Color púrpura suave */
            background: #f3e5f5;
            border-color: #e1bee7;
        }

        .btn-menu i { font-size: 2.5rem; opacity: 0.8; }

        .btn-menu:hover {
            background: #ffffff;
            border-color: #007bff;
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.15);
            transform: translateY(-8px);
        }

        .btn-config { color: #28a745; background: #e8f5e9; border-color: #c8e6c9; }
        .btn-config:hover { border-color: #28a745; box-shadow: 0 8px 25px rgba(40, 167, 69, 0.15); }
        
        .btn-interes:hover { border-color: #6f42c1; box-shadow: 0 8px 25px rgba(111, 66, 193, 0.15); }

        /* --- 4. Ventana Modal (Links de Interés) --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px;
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-modal { font-size: 28px; cursor: pointer; color: #aaa; }
        .close-modal:hover { color: #000; }

        .links-list { list-style: none; padding: 0; }
        .links-list li { margin-bottom: 15px; }
        .links-list a {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: #495057;
            font-weight: 500;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            transition: 0.3s;
        }
        .links-list a:hover {
            background: #e3f2fd;
            color: #007bff;
            transform: translateX(10px);
        }

        /* --- 5. Footer --- */
        .footer-mensaje {
            margin-top: 50px;
            font-style: italic;
            color: #868e96;
            font-size: 1rem;
            line-height: 1.6;
            border-top: 1px solid #e9ecef;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fa-solid fa-cloud-sun"></i> QUÉ HAREMOS HOY...</h1>
        
        <div class="menu-buttons">
            <a href="comandos.html" class="btn-menu">
                <i class="fa-solid fa-terminal"></i> <span>COMANDOS DE EQUIPOS</span>
            </a>
            
            <a href="configuracion.html" class="btn-menu btn-config">
                <i class="fa-solid fa-sliders"></i> <span>CONFIGURACIÓN DE EQUIPOS</span>
            </a>

            <button class="btn-menu btn-interes" onclick="openModal()">
                <i class="fa-solid fa-star"></i> <span>PÁGINAS DE INTERÉS</span>
            </button>
        </div>

        <div class="footer-mensaje">
            <p>
                <i class="fa-solid fa-wind"></i> Epa, respira profundo. No te estreses. <br> 
                ¡Dale con calma, que tú eres un crack! <i class="fa-solid fa-coffee"></i>
            </p>
        </div>
    </div>

    <div id="linksModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin:0; color:#6f42c1; font-size: 1.2rem;">Páginas de Interés</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <ul class="links-list">
                <li><a href="https://www.deepl.com/es/translator" target="_blank"><i class="fa-solid fa-language"></i> Traductor DeepL</a></li>
                <li><a href="https://macvendors.com/" target="_blank"><i class="fa-solid fa-search"></i> Ver MAC Vendor</a></li>
                <li><a href="https://mxtoolbox.com/blacklists.aspx" target="_blank"><i class="fa-solid fa-user-slash"></i> Lista Negra (Blacklist)</a></li>
                <li><a href="https://n1ufiherramientas.github.io/ufiherramientas/" target="_blank"><i class="fa-solid fa-table"></i> Tablas y Scripts</a></li>
            </ul>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("linksModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("linksModal").style.display = "none";
        }

        // Cerrar si hace clic fuera de la cajita blanca
        window.onclick = function(event) {
            let modal = document.getElementById("linksModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
