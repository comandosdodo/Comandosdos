<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Networking</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #ffffff; /* Color blanco */
            color: #333333;      /* Texto gris oscuro para que resalte */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container { text-align: center; padding: 20px; }
        h1 { margin-bottom: 40px; color: #00d4ff; text-transform: uppercase; letter-spacing: 2px; }
        
        .menu-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-menu {
            padding: 30px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-comandos:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-5px);
        }

        .btn-config:hover {
            border-color: #28a745;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
            transform: translateY(-5px);
        }

        .btn-config { color: #28a745; }
        .btn-comandos { color: #00d4ff; }

        /* Estilo del mensaje de ánimo */
        .footer-mensaje {
            margin-top: 60px;
            font-style: italic;
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            border-top: 1px solid #222;
            padding-top: 25px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .corazon { color: #ff4d4d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Qué haremos hoy...</h1>
        
        <div class="menu-buttons">
            <a href="comandos.html" class="btn-menu btn-comandos">COMANDOS DE EQUIPOS</a>
            <a href="#" class="btn-menu btn-config" onclick="alert('Próximamente...')">CONFIGURACIÓN DE EQUIPOS</a>
        </div>

        <!-- EL MENSAJE VA AQUÍ ADENTRO -->
        <div class="footer-mensaje">
            <p>Epa, respira profundo. No te estreses que todo va a salir bien. <span class="corazon">❤</span><br> 
            Un error no es el fin del mundo, tomate un café, la paz mental es lo primero. <br>
            ¡Dale con calma, que tú eres un crack!</p>
        </div>
    </div>

</body>
</html>
