<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Networking</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu-container {
            text-align: center;
            background: #1e1e1e;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { margin-bottom: 30px; color: #00d4ff; }
        .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .main-btn {
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: #252525;
            border: 2px solid #444;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }
        .main-btn:hover {
            border-color: #00d4ff;
            background: #00d4ff;
            color: #121212;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Selecciona una opción</h1>
        <div class="btn-group">
            <a href="comandos.html" class="main-btn">Comandos de Equipos</a>
            
            <a href="#" class="main-btn" onclick="alert('Próximamente...')">Configuración de Equipos</a>
        </div>
    </div>

</body>
</html>
